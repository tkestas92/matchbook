# Synthetic world configuration (docs/plan.md §5.1).
# Money values are quoted strings so they are parsed straight to Decimal, never via float.
# All clients are fictional.

seed: 20260501

months:
  start: "2026-05"
  end: "2026-10"

# Share of candidates per error type that get a planted error (generator/errors.py).
error_rate: 0.05

# Planted errors #1-#10 (docs/plan.md §5.2, decisions 025 and 037).
# Count per type = max(min_per_type, round(error_rate × candidates)), capped at the candidates
# still available (each client × platform × month carries at most one error).
errors:
  min_per_type: 3
  invoice_above_delivery:   # 1: one platform invoice line raised by pct
    pct: {min: "0.03", max: "0.15"}
  duplicate_invoice:        # 2: same invoice re-issued with a new number, days later
    delay_days: {min: 3, max: 20}
  campaign_renamed:         # 3: API reports a new name (no campaign_ref) from this day of month
    from_day: {min: 10, max: 20}
  wrong_markup:             # 5: client invoice commission off by ± percentage points
    delta_pp: {min: "2.00", max: "5.00"}
  pacing_drift:             # 7: monthly spend delivered in this share of the month
    month_share: "0.60"
  cpc_spike:                # 8: clicks ÷ multiplier at the same spend for consecutive days
    multiplier: "1.8"
    days: 3
  missing_days:             # 9: consecutive mid-month days absent from the API
    days: {min: 1, max: 3}
  prompt_injection:         # 10: copies of platform invoices with a payload, one per variant,
    variants:               #     written to inbox/ (never read by stage 1, decision 037)
      - white_text
      - tiny_font
      - outside_page
      - metadata
      - visible_note
      - fake_json
      - change_total

platforms:
  meta:
    name: Meta
    timezone: Europe/Vilnius
  google:
    name: Google
    timezone: Europe/Vilnius
  tiktok:
    name: TikTok
    timezone: UTC

# Mean levels per platform (distribution targets, not billed amounts). distributions.json
# gives only the spread (lognormal sigma); its absolute levels are unrealistic (decision 022).
ratios:
  meta:
    cpm: 6.00
    ctr: 0.010
    cvr: 0.025
  google:
    cpm: 4.50
    ctr: 0.015
    cvr: 0.035
  tiktok:
    cpm: 4.00
    ctr: 0.008
    cvr: 0.015

delivery:
  # Per campaign an amplitude a ~ U(min, max); each day actual = plan × (1 + U(-a, a)).
  noise_pct:
    min: 0.05
    max: 0.10
  # Day-to-day ratio wobble around the campaign base = Kaggle sigma × this factor.
  daily_ratio_sigma_factor: 0.25
  # Monday .. Sunday
  weekday_weights: [1.00, 1.05, 1.05, 1.00, 0.95, 0.85, 0.85]
  # Seasonality applied to each client's monthly budget.
  month_multipliers:
    "2026-05": 0.90
    "2026-06": 1.00
    "2026-07": 0.85
    "2026-08": 0.95
    "2026-09": 1.05
    "2026-10": 1.15

# The agency issuing invoices to clients (fictional).
agency:
  name: UAB Matchbook Media
  vat_code: LT100000000000
  invoice_prefix: MBM

# Rendered documents (generator/documents/, task 1.2).
documents:
  vat_rate: "0.21"
  payment_terms_days: 30
  # Platform credit notes linked to original platform invoices; amount = original subtotal × pct.
  credit_notes:
    count: 4
    pct:
      min: "0.02"
      max: "0.08"

clients:
