# Synthetic world configuration (docs/plan.md §5.1).
# Money values are quoted strings so they are parsed straight to Decimal, never via float.
# All clients are fictional.

seed: 20260501

months:
  start: "2026-05"
  end: "2026-10"

# Share of documents/records that get a planted error (used from task 1.3).
error_rate: 0.05

platforms:
  meta:
    name: Meta
    timezone: Europe/Vilnius
  google:
    name: Google
    timezone: Europe/Vilnius
  tiktok:
    name: TikTok
    timezone: UTC

# Mean levels per platform (distribution targets, not billed amounts). distributions.json
# gives only the spread (lognormal sigma); its absolute levels are unrealistic (decision 022).
ratios:
  meta:
    cpm: 6.00
    ctr: 0.010
    cvr: 0.025
  google:
    cpm: 4.50
    ctr: 0.015
    cvr: 0.035
  tiktok:
    cpm: 4.00
    ctr: 0.008
    cvr: 0.015

delivery:
  # Per campaign an amplitude a ~ U(min, max); each day actual = plan × (1 + U(-a, a)).
  noise_pct:
    min: 0.05
    max: 0.10
  # Day-to-day ratio wobble around the campaign base = Kaggle sigma × this factor.
  daily_ratio_sigma_factor: 0.25
  # Monday .. Sunday
  weekday_weights: [1.00, 1.05, 1.05, 1.00, 0.95, 0.85, 0.85]
  # Seasonality applied to each client's monthly budget.
  month_multipliers:
    "2026-05": 0.90
    "2026-06": 1.00
    "2026-07": 0.85
    "2026-08": 0.95
    "2026-09": 1.05
    "2026-10": 1.15

