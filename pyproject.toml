[project]
name = "matchbook"
version = "0.1.0"
description = "Three-way media reconciliation & reporting for agencies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "pypdf>=6.21.4,<7",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Formatter owns wrapping; keep E501 off so we need not touch migrations/roles SQL.
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = ["-ra", "--strict-markers"]
